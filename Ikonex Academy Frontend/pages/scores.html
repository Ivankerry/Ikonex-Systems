<!-- Scores page partial. Injected into #page-content by router.js -->
<!-- Logic is handled entirely by assets/js/pages/scores.js -->

<section class="page-section">
  <div class="card" style="margin-bottom: 24px;">
    <div class="card__header">
      <h2 class="card__title">Score Filter Panel</h2>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;">
      <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 150px;">
        <label class="form-label" for="score-stream-select">Class Stream</label>
        <select id="score-stream-select" class="form-select">
          <option value="">Select Stream</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 150px;">
        <label class="form-label" for="score-subject-select">Subject</label>
        <select id="score-subject-select" class="form-select" disabled>
          <option value="">Select Subject</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 120px;">
        <label class="form-label" for="score-term-select">Term</label>
        <select id="score-term-select" class="form-select">
          <option value="Term 1" selected>Term 1</option>
          <option value="Term 2">Term 2</option>
          <option value="Term 3">Term 3</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 100px;">
        <label class="form-label" for="score-year-select">Academic Year</label>
        <select id="score-year-select" class="form-select">
          <option value="2026" selected>2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
      </div>
      <button class="btn btn--primary" id="load-scores-btn" style="height: 42px;">📊 Load Scores</button>
    </div>
  </div>

  <div class="card">
    <div class="card__header">
      <h2 class="card__title">Scores Entry Grid</h2>
    </div>
    <div id="scores-grid-container">
      <!-- Populated by scores.js -->
      <div class="empty-state">
        <div class="empty-state__icon">📝</div>
        <div class="empty-state__text">Select filters above and click "Load Scores" to display the entry grid.</div>
      </div>
    </div>
  </div>
</section>
