version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ikonex-academy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automatically initializes the schema on container creation
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    # No host port mapping: ensures database is accessible only inside the docker network
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1024M
        reservations:
          memory: 256M
    # Optimized PostgreSQL settings for a 1 CPU / 2 GB RAM VPS host
    command: >
      postgres 
      -c shared_buffers=256MB 
      -c work_mem=8MB 
      -c maintenance_work_mem=64MB 
      -c effective_cache_size=512MB 
      -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ikonex-academy-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bind strictly to localhost (127.0.0.1) so Docker doesn't open the port to the public.
      # Host Nginx will reverse proxy requests here.
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-postgres}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DB_SSL: "false" # Communication inside the Docker bridge network is internal and doesn't require SSL
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    driver: local
