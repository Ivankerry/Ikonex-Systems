# =========================================================================
# Ikonex Academy Backend - Host Nginx Configuration Template
# Path on VPS: /etc/nginx/sites-available/ikonex-academy-api
# Enable it: ln -s /etc/nginx/sites-available/ikonex-academy-api /etc/nginx/sites-enabled/
# =========================================================================

# Define Rate Limiting Zone:
# - $binary_remote_addr: track requests by client IP address
# - zone=api_limit:10m: allocates 10MB memory for tracking (~160,000 IPs)
# - rate=10r/s: average rate limit of 10 requests per second
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;

    # Use VPS public IP address or your domain name
    server_name YOUR_VPS_IP_OR_DOMAIN;

    # Maximum upload size limit
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/ikonex_api_access.log;
    error_log /var/log/nginx/ikonex_api_error.log warn;

    # Security Headers (excluding overly restrictive CSP for frontend assets)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy configuration to redirect traffic to backend container
    location /api {
        # Apply rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        # Forward requests to the backend Docker container (using Docker DNS 'backend')
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        # Support WebSockets & keep-alive connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Request forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout limits optimized for 1 CPU / 2 GB RAM server
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
